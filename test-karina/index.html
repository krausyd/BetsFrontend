    <script>
        // Same season-year logic used elsewhere on the site.
        const getCurrentSeasonYear = () => {
            const now = new Date();
            const month = now.getMonth(); // 0 = January
            return month <= 1 ? now.getFullYear() - 1 : now.getFullYear();
        };
        document.getElementById("season").innerText = `Season ${getCurrentSeasonYear()}`;
