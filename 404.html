<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
    <nav>
        <img class="nfl-logo" src="./assets/nfl-3644686_1280.png" />
        <div id="season" class="season-header"></div>
        <ul>
            <li><a href="./index.html">Go to pick</a></li>
            <li><a href="./compare.html">Compare per week</a></li>
            <li><a href="./performance.html">Same per week</a></li>
            <li><a href="./stats.html">All stats</a></li>
        </ul>
    </nav>
    <section class="main">
        <div class="not-found">
            <h1>404</h1>
            <p>This page doesn't exist. Check the link, or pick one of the pages above.</p>
        </div>
    </section>
    <script>
        // Same season-year logic used elsewhere on the site, inlined here
        // since this page doesn't load the full games.js script.
        const getCurrentSeasonYear = () => {
            const now = new Date();
            const month = now.getMonth(); // 0 = January
            return month <= 1 ? now.getFullYear() - 1 : now.getFullYear();
        };
        document.getElementById("season").innerText = `Season ${getCurrentSeasonYear()}`;
    </script>
</body>
</html>
